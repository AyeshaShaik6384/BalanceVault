
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalanceVault — Account Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 640px) {
            body { overflow-x: hidden; }
            aside { width: 76px !important; }
            aside > div { padding-left: 10px !important; padding-right: 10px !important; }
            aside nav a { justify-content: center; }
            main section { padding-left: 18px !important; padding-right: 18px !important; }
            main header { padding-left: 18px !important; padding-right: 18px !important; }
        }
    </style>
</head>

<body class="bg-[#f7f8f5] flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-[244px] bg-[#163b30] text-white flex flex-col min-h-screen shrink-0">

        <div class="px-5 pt-7">

            <!-- LOGO -->
            <div class="flex items-center gap-2 mb-12">
                <div class="w-8 h-8 rounded-lg bg-[#e8f0e9] text-[#164535] flex items-center justify-center font-bold text-lg">
                    b
                </div>
                <span class="font-bold text-sm">balancevault</span>
            </div>

            <!-- NAVIGATION -->
            <p class="text-[9px] uppercase tracking-[2px] text-[#9bb8aa] font-semibold mb-4 px-1">
                Workspace
            </p>

            <nav class="space-y-1.5 text-xs">

                <a href="/dashboard.html"
                   class="flex items-center gap-3 px-3 py-3 rounded-lg text-gray-300 hover:bg-white/10">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>

                    Overview
                </a>


                <a href="/accounts.html"
                   class="flex items-center justify-between px-3 py-3 rounded-lg text-gray-300 hover:bg-white/10">

                    <span class="flex items-center gap-3">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 10h18M7 15h3"/>
                        </svg>

                        Accounts

                    </span>

                    <span>›</span>
                </a>


                <a href="/statements.html"
                   class="flex items-center gap-3 px-3 py-3 rounded-lg text-gray-300 hover:bg-white/10">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M3 12h3l3-8 5 16 3-8h4"/>
                    </svg>

                    Statements
                </a>


                <!-- ACTIVE ACCOUNT REQUEST -->
                <a href="/account-request.html"
                   class="flex items-center gap-3 px-3 py-3 rounded-lg bg-white/10 border-l-2 border-[#b6c99c] font-medium text-white">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>

                    Account request
                </a>

            </nav>
        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0 overflow-y-auto">

        <!-- HEADER -->
        <header class="h-[72px] bg-[#fcfcfa] border-b border-gray-200 flex justify-between items-center px-8 md:px-14">

            <div class="flex items-center gap-3 text-[10px]">
                <span class="text-gray-400">Workspace</span>
                <span class="text-gray-300">/</span>
                <span class="font-semibold text-gray-600">Overview</span>
            </div>


            <!-- RIGHT HEADER -->
            <div class="flex items-center gap-4 md:gap-6">

                <div class="hidden sm:flex items-center gap-2 text-[9px] text-gray-500">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#66a879]"></span>
                    Systems operational
                </div>

                <div class="h-7 border-l border-gray-200"></div>

                <!-- PROFILE -->
                <div class="relative">

                    <button id="profile-btn" class="flex items-center gap-2">

                        <div class="w-7 h-7 rounded-full bg-[#e7eee7] border border-[#d7e3d8] flex items-center justify-center text-xs text-[#416b50]">
                            S
                        </div>

                        <div class="text-left">
                            <p id="user-name" class="text-[10px] font-semibold text-gray-700">
                                Shaik
                            </p>

                            <p class="text-[8px] text-gray-400">
                                Account holder
                            </p>
                        </div>

                        <span class="text-gray-500 text-xs">⌄</span>

                    </button>


                    <div id="profile-menu"
                         class="hidden absolute right-0 top-10 bg-white border border-gray-200 rounded-lg shadow-lg w-36 z-20">

                        <button id="logout-btn"
                                class="w-full text-left px-4 py-3 text-xs text-red-600 hover:bg-gray-50 rounded-lg">
                            Sign out
                        </button>

                    </div>

                </div>

            </div>

        </header>


        <!-- PAGE CONTENT -->
        <section class="px-8 md:px-14 py-14">

            <div class="max-w-[1138px] mx-auto">

                <!-- TITLE -->
                <p class="text-[9px] uppercase tracking-[2px] font-semibold text-[#8b9c91] mb-3">
                    Onboarding
                </p>

                <h1 class="text-[34px] leading-tight font-serif text-[#173d30] mb-2">
                    Account request
                </h1>

                <p class="text-[10px] text-gray-500 mb-7">
                    Customer accounts are opened after administrator review.
                </p>


                <!-- REQUEST FORM -->
                <div class="bg-white border border-[#dfe6de] rounded-xl p-5 mb-4">

                    <form id="request-form">

                        <label for="account-type"
                               class="block text-[10px] font-semibold text-gray-700 mb-2">

                            Requested account type

                        </label>


                        <select id="account-type"
                                name="account_type"
                                required
                                class="w-full bg-transparent text-[10px] font-medium text-gray-800 outline-none cursor-pointer mb-3">

                            <option value="Personal">Personal</option>

                            <option value="Savings">Savings</option>

                            <option value="Business">Business</option>

                        </select>


                        <!-- SUBMIT BUTTON -->
                        <button type="submit"
                                id="submit-btn"
                                class="w-full bg-[#205744] hover:bg-[#174534] text-white text-[10px] font-semibold py-4 rounded-lg shadow-md transition">

                            Submit request

                        </button>

                    </form>

                    <p id="message" class="text-xs mt-3 text-center hidden"></p>

                </div>


                <!-- YOUR REQUESTS -->
                <div class="mt-4">

                    <h2 class="text-xs font-medium text-gray-700 mb-4">
                        Your requests
                    </h2>


                    <div id="requests-list" class="space-y-3">

                        <div class="bg-white border border-[#dfe6de] rounded-xl p-5 text-center text-xs text-gray-400">
                            Loading requests...
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script>

        const requestForm = document.getElementById('request-form');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submit-btn');


        // Escape dynamic text before inserting it into HTML
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[char]);
        }


        // LOAD USER
        async function loadUser() {

            const res = await fetch('/api/auth/me');

            if (!res.ok) {
                window.location.href = '/index.html';
                return false;
            }

            const user = await res.json();

            document.getElementById('user-name').textContent =
                user.fullname || user.name || 'User';

            return true;
        }


        // LOAD ACCOUNT REQUESTS
        async function loadRequests() {

            const container = document.getElementById('requests-list');

            try {

                const res = await fetch('/api/accounts/requests');

                if (!res.ok) {
                    throw new Error('Unable to load requests');
                }

                const requests = await res.json();

                if (!Array.isArray(requests) || requests.length === 0) {

                    container.innerHTML = `
                        <div class="bg-white border border-dashed border-[#dfe6de] rounded-xl p-8 text-center">
                            <p class="text-[10px] font-semibold text-gray-700 mb-1">
                                No requests yet
                            </p>
                            <p class="text-[9px] text-gray-400">
                                Your submitted account requests will appear here.
                            </p>
                        </div>
                    `;

                    return;
                }


                container.innerHTML = requests.map(req => {

                    const status = String(req.status || 'PENDING').toUpperCase();

                    const statusClass =
                        status === 'APPROVED'
                            ? 'bg-emerald-50 text-emerald-700'
                            : status === 'REJECTED'
                            ? 'bg-red-50 text-red-700'
                            : 'bg-[#f0f4ed] text-[#55745d]';


                    const date = req.created_at || req.timestamp;

                    return `

                        <div class="bg-white border border-[#dfe6de] rounded-xl p-5 flex flex-wrap justify-between items-center gap-3">

                            <div>
                                <p class="text-xs font-bold text-gray-900 uppercase">
                                    ${escapeHTML(req.account_type || req.type || 'Personal')} account
                                </p>
                            </div>

                            <span class="text-[8px] font-semibold px-3 py-1 rounded-full ${statusClass}">
                                ${escapeHTML(status)}
                            </span>

                            <span class="text-[9px] text-gray-400">
                                ${date ? escapeHTML(new Date(date).toLocaleString()) : ''}
                            </span>

                        </div>

                    `;

                }).join('');


            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="text-xs text-red-500 py-4">
                        Unable to load requests.
                    </div>
                `;

            }

        }


        // SUBMIT ACCOUNT REQUEST
        requestForm.addEventListener('submit', async (e) => {

            e.preventDefault();

            const accountType =
                document.getElementById('account-type').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            message.classList.add('hidden');

            try {

                const res = await fetch('/api/accounts/request', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        accountType: accountType
                    })

                });


                const result = await res.json();

                if (!res.ok) {
                    throw new Error(result.message || result.error || 'Request submission failed');
                }


                message.textContent =
                    result.message || 'Account request submitted successfully!';

                message.className =
                    'text-xs mt-3 text-center text-emerald-700';


                // Refresh requests
                await loadRequests();


            } catch (error) {

                message.textContent = error.message;

                message.className =
                    'text-xs mt-3 text-center text-red-600';

            } finally {

                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit request';

            }

        });


        // PROFILE DROPDOWN
        document.getElementById('profile-btn')
            .addEventListener('click', () => {

                document.getElementById('profile-menu')
                    .classList.toggle('hidden');

            });


        // LOGOUT
        document.getElementById('logout-btn')
            .addEventListener('click', async () => {

                await fetch('/api/auth/logout', {
                    method: 'POST'
                });

                window.location.href = '/index.html';

            });


        // INITIALIZE
        async function initializePage() {

            const authenticated = await loadUser();

            if (authenticated) {
                await loadRequests();
            }

        }

        initializePage();

    </script>

</body>
</html>
